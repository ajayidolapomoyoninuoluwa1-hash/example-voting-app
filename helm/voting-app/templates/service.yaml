{{- range $name, $svc := .Values.services }}
{{- if $svc.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: {{ $svc.service.type }}
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.service.port }}
      targetPort: {{ $svc.containerPort }}
{{- end }}
{{- end }}
